<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AeroCraftle – Aircraft Guessing Game</title>
    <link rel="icon" type="image/png" href="https://github.com/WormDude/AeroCraftle/blob/main/image_2026-05-03_151522057.png?raw=true">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background: #121213; color: white; text-align: center; margin: 0; padding-bottom: 50px; }
        #main { max-width: 420px; margin: 40px auto; padding: 0 15px; position: relative; }
        #gameModeContainer { position: absolute; top: -35px; left: 15px; z-index: 100; }
        #gameModeSelect { background: #3a3a3c; color: white; border: none; padding: 5px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        #modeToggle { position: absolute; top: -35px; right: 15px; background: #538d4e; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; z-index: 10; }
        #timer, #streakBox { margin-bottom: 8px; font-weight: 600; opacity: 0.8; }
        #answerReveal { background: #b59b00; color: black; font-weight: 700; padding: 12px; border-radius: 8px; margin-bottom: 15px; display: none; }
        #navBar { display: none; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .nav-btn { background: #3a3a3c; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 11px; font-weight: bold; transition: background 0.2s; }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .nav-btn.active { background: #538d4e; }
        #tileWrapper { position: relative; width: 100%; margin-bottom: 20px; min-height: 200px; }
        #baseImage { width: 100%; display: block; border-radius: 10px; background: #1a1a1b; min-height: 200px; object-fit: contain; }
        #tileGrid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); pointer-events: none; }
        .tile { background: #111; border: 1px solid #000; transition: opacity 0.4s ease; }
        .tile.revealed { opacity: 0; }
        #inputRow { display: flex; gap: 10px; }
        #input { flex: 1; padding: 14px; border: none; border-radius: 8px; background: #1a1a1b; color: white; outline: none; font-size: 16px; }
        #guessBtn { padding: 0 20px; border: none; border-radius: 8px; background: #3a3a3c; color: white; cursor: pointer; font-weight: 600; }
        .big-btn { display: none; width: 100%; margin-top: 15px; padding: 14px; border: none; border-radius: 8px; background: #5a5a5c; color: white; cursor: pointer; font-weight: bold; }
        #playAgainBtn { background: #538d4e; margin-top: 20px; }
        #dropdown { background: #1a1a1b; margin-top: 5px; border-radius: 8px; max-height: 200px; overflow-y: auto; text-align: left; }
        .option { padding: 12px; cursor: pointer; border-bottom: 1px solid #222; }
        .option:hover { background: #3a3a3c; }
        .row { display: grid; grid-template-columns: 1fr 50px 60px; background: #1a1a1b; margin-top: 8px; padding: 12px; border-radius: 8px; align-items: center; }
        .row.correct { background: #538d4e; }
        .price-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .price-btn { padding: 18px; border-radius: 8px; border: none; background: #3a3a3c; color: white !important; cursor: pointer; font-weight: 700; font-size: 14px; }
        .no-price-msg { font-size: 18px; font-weight: 600; margin: 30px 0; color: #aaa; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .bonus-select-btn { padding: 15px; border-radius: 8px; border: none; background: #3a3a3c; color: white; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="main">
        <div id="gameModeContainer">
            <select id="gameModeSelect" onchange="changeMode(this.value)">
                <option value="standard">Standard</option>
                <option value="dev">Event/Dev</option>
                <option value="boats">Boats</option>
            </select>
        </div>
        <button id="modeToggle" onclick="toggleMode()">Unlimited Mode</button>
        <h1 id="gameTitle">AeroCraftle</h1>

        <div id="navBar">
            <button class="nav-btn" id="nav-main" onclick="switchView('main')">Round 1</button>
            <button class="nav-btn" id="nav-loc" onclick="openBonus1()">Bonus 1</button>
            <button class="nav-btn" id="nav-price" onclick="switchView('price')">Bonus 2</button>
            <button class="nav-btn" id="nav-rarity" onclick="switchView('rarity')">Bonus 3</button>
        </div>

        <div id="timer">Loading...</div>
        <div id="streakBox">🔥 Standard streak: 0</div>
        <div id="answerReveal"></div>

        <div id="tileWrapper">
            <img id="baseImage" alt="Aircraft to guess">
            <div id="tileGrid"></div>
        </div>

        <div id="inputRow">
            <input id="input" autocomplete="off" placeholder="Type name...">
            <button id="guessBtn">Guess</button>
        </div>

        <button id="bonusBtn" class="big-btn">PLAY BONUS ROUND</button>
        <button id="priceBonusBtn" class="big-btn">PLAY 2ND BONUS ROUND</button>
        <button id="rarityBonusBtn" class="big-btn">PLAY 3RD BONUS ROUND</button>
        <button id="nextBonusBtn" class="big-btn">PLAY NEXT BONUS ROUND</button>
        <button id="playAgainBtn" class="big-btn" onclick="resetUnlimited()">PLAY AGAIN</button>

        <div id="dropdown"></div>
        <div id="grid"></div>
    </div>

    <script>
        const COUNTRY_DATA = [

            { name: "Udyanapura", flag: "https://cdn.wikioasis.org/aeronauticawiki/thumb/5/56/Flag_of_Udyanapura.png/300px-Flag_of_Udyanapura.png" },
            { name: "Zhongjing", flag: "https://cdn.wikioasis.org/aeronauticawiki/thumb/b/ba/Flag_of_Zhongjing.png/300px-Flag_of_Zhongjing.png" },
            { name: "Tselinoyarsk", flag: "https://cdn.wikioasis.org/aeronauticawiki/thumb/5/56/Flag_of_Tselinoyarsk.png/300px-Flag_of_Tselinoyarsk.png" },
            { name: "Eisenhardt", flag: "https://cdn.wikioasis.org/aeronauticawiki/thumb/4/40/Flag_of_Eisenhardt.png/300px-Flag_of_Eisenhardt.png" },
            { name: "Aska", flag: "https://cdn.wikioasis.org/aeronauticawiki/thumb/8/8d/Flag_of_Aska.png/300px-Flag_of_Aska.png" },
            { name: "Enoksen", flag: "https://cdn.wikioasis.org/aeronauticawiki/thumb/4/43/Flag_of_Enoksen.png/300px-Flag_of_Enoksen.png" },
            { name: "Ishenhorsk", flag: "https://cdn.wikioasis.org/aeronauticawiki/thumb/4/4b/Flag_of_Ishenhorsk.png/300px-Flag_of_Ishenhorsk.png" },
            { name: "Novacadia", flag: "https://cdn.wikioasis.org/aeronauticawiki/thumb/a/a0/Flag_of_Novacadia.png/300px-Flag_of_Novacadia.png" },

            { name: "Alpinora", flag: "https://cdn.wikioasis.org/aeronauticawiki/thumb/a/aa/Flag_of_Alpinora.png/300px-Flag_of_Alpinora.png" },
            { name: "Arleau", flag: "https://cdn.wikioasis.org/aeronauticawiki/thumb/6/6e/Flag_of_Arleau.png/300px-Flag_of_Arleau.png" },
            { name: "Chereine", flag: "https://cdn.wikioasis.org/aeronauticawiki/thumb/a/a9/Flag_of_Chereine.png/300px-Flag_of_Chereine.png" },
            { name: "Costania", flag: "https://cdn.wikioasis.org/aeronauticawiki/thumb/9/94/Flag_of_Costania.png/300px-Flag_of_Costania.png" },
            { name: "Hellamos", flag: "https://cdn.wikioasis.org/aeronauticawiki/thumb/7/7c/Flag_of_Hellamos.png/300px-Flag_of_Hellamos.png" },
            { name: "Himmelsberg", flag: "https://aeronautica.wikioasis.org/wiki/Special:Redirect/file/Flag_of_Himmelsberg.png" },
            { name: "Anhedral", flag: "https://cdn.wikioasis.org/aeronauticawiki/thumb/6/6a/Flag_of_Anhedral.png/300px-Flag_of_Anhedral.png" },
            { name: "Smaragaidia", flag: "https://cdn.wikioasis.org/aeronauticawiki/thumb/f/fb/Flag_of_Smaragaidia.png/300px-Flag_of_Smaragaidia.png" },
            { name: "Lalland", flag: "https://cdn.wikioasis.org/aeronauticawiki/thumb/6/67/Flag_of_Lalland.png/300px-Flag_of_Lalland.png" },
            { name: "Portona", flag: "https://cdn.wikioasis.org/aeronauticawiki/thumb/4/4f/Flag_of_Portona.png/300px-Flag_of_Portona.png" },
            { name: "Rawaki", flag: "https://cdn.wikioasis.org/aeronauticawiki/thumb/7/76/Flag_of_Rawaki.png/300px-Flag_of_Rawaki.png" },
            { name: "Saalhofen", flag: "https://cdn.wikioasis.org/aeronauticawiki/thumb/2/28/Flag_of_Saalhofen.png/300px-Flag_of_Saalhofen.png" },
            { name: "Schalperland", flag: "https://cdn.wikioasis.org/aeronauticawiki/thumb/d/d1/Flag_of_Schalperland.png/300px-Flag_of_Schalperland.png" },
            { name: "Walowia", flag: "https://cdn.wikioasis.org/aeronauticawiki/thumb/8/87/Flag_of_Walowia.png/300px-Flag_of_Walowia.png" },
            { name: "Alavega", flag: "https://cdn.wikioasis.org/aeronauticawiki/thumb/1/15/Flag_of_Alavega.png/300px-Flag_of_Alavega.png" },
            { name: "None / Crafted", flag: "" }
        ];

        const RARITIES = { "Widespread": "#FFFFFF", "Common": "#32CD32", "Uncommon": "#F0E68C", "Rare": "#9370DB", "Ultra Rare": "#0000FF", "Epic": "#FF8C00", "Mythical": "#00FFFF", "Legendary": "#FF0000" };

        const DATA = [
            { name: "General Dynamics F-16 Fighting Falcon", image: "https://github.com/WormDude/aeroportle-images/blob/main/Screenshot%202026-02-20%20065951.png?raw=true", soldAt: "Eisenhardt", price: "21000", rarity: "Uncommon", mode: "standard" },
            { name: "Airbus A300-600ST Beluga", image: "https://github.com/WormDude/aeroportle-images/blob/main/Screenshot%202026-02-26%20063553.png?raw=true", soldAt: "Arleau", price: "74000", rarity: "Rare", mode: "standard" },
            { name: "Hughes H-4 Hercules", image: "https://github.com/WormDude/aeroportle-images/blob/main/Screenshot%202026-01-01%20181938.png?raw=true", soldAt: "None / Crafted", price: "", rarity: "Epic", mode: "standard" },
            { name: "Lockheed C-130H Hercules", image: "https://github.com/WormDude/aeroportle-images/blob/main/Screenshot%202026-03-05%20172720.png?raw=true", soldAt: "United Isles of Oconia", price: "11600", rarity: "Common", mode: "standard" },
            { name: "Airbus A320-200", image: "https://github.com/WormDude/aeroportle-images/blob/main/Screenshot%202026-02-25%20170554.png?raw=true", soldAt: "Anhedral", price: "19800", rarity: "Widespread", mode: "standard" },
            { name: "High Altitude Surveillance Balloon", image: "https://github.com/WormDude/aeroportle-images/blob/main/Screenshot%202026-02-26%20062714.png?raw=true", soldAt: "Zhongjing", price: "5000", rarity: "Rare", mode: "standard" },
            { name: "The Skeld", image: "https://cdn.wikioasis.org/aeronauticawiki/4/4d/Skeld-2.png", devType: "Dev", aircraftType: "Single Engine", mode: "dev" },
            { name: "Death Star", image: "https://cdn.wikioasis.org/aeronauticawiki/a/af/DEATHSTAR.png", devType: "Unobtainable", aircraftType: "Airship", mode: "dev" },
            { name: "Katan X-50 Ranger", image: "https://cdn.wikioasis.org/aeronauticawiki/b/ba/Katan-1.png", devType: "Event", eventTier: "Tier III", aircraftType: "Airship", mode: "dev" },
            { name: "Neucom Incorporated R-505U", image: "https://github.com/WormDude/aeroportle-images/blob/main/Screenshot%202025-12-31%20102619.png?raw=true", devType: "Event", eventTier: "Tier III", aircraftType: "Supersonic Transport", mode: "dev" },
            { name: "Dornier Seastar", image: "https://raw.githubusercontent.com/WormDude/aeroportle-images/refs/heads/main/Screenshot%202026-03-07%20062208.png", badgeIcon: "https://cdn.wikioasis.org/aeronauticawiki/f/fd/1st_Anniversary_badge.png", badgeName: "1 Year Anniversary", devType: "Badge", aircraftType: "Multi Engine", mode: "dev" },
            { name: "Astraeus ADF-340X Relay", image: "https://cdn.wikioasis.org/aeronauticawiki/d/dc/Astraeus_ADF-340X_Relay_1.png", badgeIcon: "https://cdn.wikioasis.org/aeronauticawiki/d/d7/Valentines_2024_badge.png", badgeName: "Valentines 2024", devType: "Badge", aircraftType: "Jet Engine", mode: "dev" },
            { name: "Boeing 929 Jetfoil", image: "https://cdn.wikioasis.org/aeronauticawiki/9/97/Boeing_929_Jetfoil_0.png", soldAt: "Zhongjing", price: "54900", rarity: "Uncommon", mode: "boats" },
            { name: "Leo-class Cruise Ship", image: "https://cdn.wikioasis.org/aeronauticawiki/0/08/Leo-class_Cruise_Ship_0.png", soldAt: "Saalhofen", price: "483000", rarity: "Uncommon", mode: "boats" },
            { name: "Ulyanovsk-class Aircraft Carrier", image: "https://cdn.wikioasis.org/aeronauticawiki/8/80/Ulyanovsk-class_Aircraft_Carrier.png", soldAt: "Tselinoyarsk", price: "815000", rarity: "Epic", mode: "boats" },
            { name: "Zumwalt-class Destroyer", image: "https://cdn.wikioasis.org/aeronauticawiki/b/bf/Zumwalt-class_Destroyer_0.png", soldAt: "United Isles of Oconia", price: "283000", rarity: "Ultra Rare", mode: "boats" },
            { name: "Food Boat", image: "https://cdn.wikioasis.org/aeronauticawiki/6/61/Food_Boat_0.png", soldAt: "United Isles of Oconia", price: "500", rarity: "Common", mode: "boats" },
            { name: "Azzam-class Superyacht", image: "https://cdn.wikioasis.org/aeronauticawiki/d/d2/Azzam-class_Superyacht_5.png", soldAt: "United Isles of Oconia", price: "672000", rarity: "Epic", mode: "boats" }
        ];

        const MAN_BADGES = ["1 Year Anniversary", "Halloween 2022", "Valentines 2023", "April Fools 2023", "2nd Year Anniversary!", "VE Day 2023", "100k Favorites!", "Halloween 2023", "10 Million Visits!", "New Years 2024", "Valentines 2024", "3rd Year Anniversary!", "Halloween 2024", "20 Million Visits!", "Proficient Pilot", "Captain", "Circumnavigation", "Space Commander", "Supersonic Transport Mastery"];
        const STREAK_UI_LABEL = { standard: "Standard", dev: "Dev/Event", boats: "Boats" };

        let today, currentAircraft, gameOver = false, bonusMode = false, priceRanges = [], isUnlimited = false;
        let currentMode = "standard";
        let u_played = false, u_loc = false, u_price = false, u_rarity = false;
        let u_history_main = [], u_history_loc = [], u_loc_guess = "", u_price_guess = "", u_rarity_guess = "";
        let u_recent_answers_by_mode = { standard: [], dev: [], boats: [] }, hiddenPoolMain = [], hiddenPoolLoc = [];

        function streakKey(mode) { return "aero_streak_" + mode; }
        function getRecentQueue() { if (!u_recent_answers_by_mode[currentMode]) u_recent_answers_by_mode[currentMode] = []; return u_recent_answers_by_mode[currentMode]; }
        function devPriceDoneRead() { return isUnlimited ? u_price : (localStorage.getItem("aero_price_done_" + currentMode) === today); }

        function refreshStreakDisplay() {
            const lbl = STREAK_UI_LABEL[currentMode] || currentMode;
            const n = localStorage.getItem(streakKey(currentMode)) || "0";
            document.getElementById("streakBox").textContent = "🔥 " + lbl + " streak: " + n;
        }

        function changeMode(val) { currentMode = val; if (isUnlimited) resetUnlimited(); else initDaily(); }

        function initDaily() {
            today = new Date().toDateString();
            if (localStorage.getItem("aero_last_date") !== today) { localStorage.clear(); localStorage.setItem("aero_last_date", today); }
            const pool = DATA.filter(d => d.mode === currentMode);
            const index = Math.floor((new Date() - new Date(2024, 0, 1)) / 86400000) % pool.length;
            currentAircraft = pool[index];
            refreshStreakDisplay();
            generateDailyPriceRanges();
            resetTilePools();
            switchView('main');
        }

        function toggleMode() {
            isUnlimited = !isUnlimited;
            document.getElementById("modeToggle").textContent = isUnlimited ? "Daily Mode" : "Unlimited Mode";
            document.getElementById("timer").style.display = isUnlimited ? "none" : "block";
            if (isUnlimited) { u_recent_answers_by_mode = { standard: [], dev: [], boats: [] }; resetUnlimited(); }
            else initDaily();
        }

        function resetUnlimited() {
            if (isUnlimited) {
                const pool = DATA.filter(d => d.mode === currentMode);
                const recent = getRecentQueue();
                let newAircraft;
                do { newAircraft = pool[Math.floor(Math.random() * pool.length)]; } while (recent.includes(newAircraft.name) && pool.length > 5);
                currentAircraft = newAircraft;
                recent.push(currentAircraft.name);
                if (recent.length > 5) recent.shift();
                u_played = false; u_loc = false; u_price = false; u_rarity = false;
                u_history_main = []; u_history_loc = []; u_loc_guess = ""; u_price_guess = ""; u_rarity_guess = "";
                resetTilePools();
                generateDailyPriceRanges();
            }
            switchView('main');
            refreshStreakDisplay();
        }

        function resetTilePools() { hiddenPoolMain = [0,1,2,3,4,5]; hiddenPoolLoc = [0,1,2,3,4,5]; shuffle(hiddenPoolMain); shuffle(hiddenPoolLoc); }
        function shuffle(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } }

        function generateDailyPriceRanges() {
            priceRanges = [];
            if (!currentAircraft.price) return;
            const price = parseInt(currentAircraft.price, 10);
            const step = price > 50000 ? 10000 : (price > 10000 ? 5000 : 1000);
            const correctIndex = Math.floor(Math.random() * 4);
            const randomOffset = Math.floor(Math.random() * (step * 0.5));
            let start = Math.max(0, Math.floor((price - (correctIndex * step) - randomOffset) / 500) * 500);
            for (let i = 0; i < 4; i++) {
                const min = start + (i * step), max = min + step - 1;
                priceRanges.push({ min, max, text: `${min.toLocaleString()} - ${max.toLocaleString()}`, isCorrect: (price >= min && price <= max) });
            }
        }

        function isMainDone() { return isUnlimited ? u_played : (localStorage.getItem("aero_played_day_" + currentMode) === today); }
        function isLocDone() { return isUnlimited ? u_loc : (localStorage.getItem("aero_loc_done_" + currentMode) === today); }
        function isPriceDone() { return isUnlimited ? u_price : (localStorage.getItem("aero_price_done_" + currentMode) === today); }
        function isRarityDone() { return isUnlimited ? u_rarity : (localStorage.getItem("aero_rarity_done_" + currentMode) === today); }

        function showPlayAgainIfUnlimitedComplete() {
            document.getElementById("playAgainBtn").style.display = (isUnlimited && isRarityDone()) ? "block" : "none";
        }

        function openBonus1() {
            if (!isMainDone()) return;
            gameOver = false;
            switchView("loc");
        }

        function switchView(mode) {
            document.getElementById("grid").innerHTML = "";
            document.getElementById("dropdown").innerHTML = "";
            document.getElementById("inputRow").style.display = "none";
            ["bonusBtn", "priceBonusBtn", "rarityBonusBtn", "nextBonusBtn", "playAgainBtn"].forEach(id => document.getElementById(id).style.display = "none");

            const playedMain = isMainDone(), locDone = isLocDone(), priceDone = isPriceDone(), rarityDone = isRarityDone();
            document.getElementById("navBar").style.display = playedMain ? "flex" : "none";
            document.getElementById("nav-loc").disabled = !playedMain;
            document.getElementById("nav-price").disabled = !locDone;
            document.getElementById("nav-rarity").disabled = !priceDone;

            const grid = document.getElementById("grid"), ans = document.getElementById("answerReveal"), wrapper = document.getElementById("tileWrapper"), inputRow = document.getElementById("inputRow");
            ans.style.display = "none";
            wrapper.style.display = "block";

            if (mode === "main") {
                bonusMode = false;
                document.getElementById("gameTitle").textContent = isUnlimited ? "AeroCraftle (Unlimited)" : "AeroCraftle";
                rebuildGrid("main");
                if (playedMain) { showNotification("★ Answer: " + currentAircraft.name); fullReveal(); }
                else { inputRow.style.display = "flex"; gameOver = false; }
                if (playedMain && !locDone) document.getElementById("bonusBtn").style.display = "block";
                if (locDone && !priceDone) document.getElementById("priceBonusBtn").style.display = "block";
                if (priceDone && !rarityDone) document.getElementById("rarityBonusBtn").style.display = "block";
            } else if (mode === "loc") {
                bonusMode = true;
                if (currentMode === "dev") renderDevBonus1();
                else renderSoldAtRound(locDone);
                if (locDone && !priceDone) setNextBonus("price");
            } else if (mode === "price") {
                wrapper.style.display = "none";
                if (currentMode === "dev") renderDevBonus2();
                else { document.getElementById("gameTitle").textContent = "Bonus 2: Guess the Price"; startPriceRound(); }
                if (priceDone && !rarityDone) setNextBonus("rarity");
            } else if (mode === "rarity") {
                wrapper.style.display = "none";
                if (currentMode === "dev") renderDevBonus3();
                else { document.getElementById("gameTitle").textContent = "Bonus 3: What is the Rarity?"; startRarityRound(); }
            }

            showPlayAgainIfUnlimitedComplete();
            const active = { main: "nav-main", loc: "nav-loc", price: "nav-price", rarity: "nav-rarity" }[mode];
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.toggle('active', btn.id === active));
        }

        function setNextBonus(target) {
            const btn = document.getElementById("nextBonusBtn");
            btn.style.display = "block";
            btn.textContent = "PLAY NEXT BONUS ROUND";
            btn.onclick = () => switchView(target);
        }

        function renderSoldAtRound(locDone) {
            document.getElementById("gameTitle").textContent = "Bonus: Where is it sold?";
            rebuildGrid("loc");
            if (locDone) { showNotification("★ Answer: " + currentAircraft.soldAt); fullReveal(); }
            else { document.getElementById("inputRow").style.display = "flex"; gameOver = false; }
        }

        function renderDevBonus1() {
            document.getElementById("gameTitle").textContent = "Bonus 1: What type is this?";
            document.getElementById("tileWrapper").style.display = "none";
            const locDone = isLocDone();
            gameOver = locDone;
            const savedGuess = isUnlimited ? u_loc_guess : localStorage.getItem("aero_loc_guess_" + currentMode);
            renderButtonGrid(["Dev", "Event", "Badge", "Unobtainable"], currentAircraft.devType, locDone, choice => {
                if (choice === currentAircraft.devType) confetti();
                if (isUnlimited) {
                    u_loc = true;
                    u_loc_guess = choice;
                } else {
                    localStorage.setItem("aero_loc_done_" + currentMode, today);
                    localStorage.setItem("aero_loc_guess_" + currentMode, choice);
                }
                gameOver = true;
                switchView("loc");
            }, false, savedGuess);
            if (locDone) showNotification("★ Answer: " + currentAircraft.devType);
        }

        function renderDevBonus2() {
            document.getElementById("inputRow").style.display = "none";
            const priceDone = devPriceDoneRead();
            if (currentAircraft.devType === "Event") {
                document.getElementById("gameTitle").textContent = "Bonus 2: What event tier?";
                const savedTierGuess = isUnlimited ? u_price_guess : localStorage.getItem("aero_price_guess_" + currentMode);
                renderButtonGrid(["Tier I", "Tier II", "Tier III", "Tier IV", "Single Event"], currentAircraft.eventTier, priceDone, choice => {
                    if (choice === currentAircraft.eventTier) confetti();
                    if (isUnlimited) {
                        u_price = true;
                        u_price_guess = choice;
                    } else {
                        localStorage.setItem("aero_price_done_" + currentMode, today);
                        localStorage.setItem("aero_price_guess_" + currentMode, choice);
                    }
                    switchView("price");
                }, false, savedTierGuess);
                if (priceDone) showNotification("★ Answer: " + currentAircraft.eventTier);
                return;
            }
            if (currentAircraft.devType === "Badge") {
                document.getElementById("gameTitle").textContent = "Bonus 2: What badge gives this?";
                bonusMode = true;
                document.getElementById("tileWrapper").style.display = "block";
                if (priceDone) { gameOver = true; rebuildGrid("loc"); fullReveal(); showNotification("★ Answer: " + currentAircraft.badgeName); return; }
                gameOver = false;
                document.getElementById("inputRow").style.display = "flex";
                rebuildGrid("loc");
                return;
            }
            const msg = document.createElement("div");
            msg.className = "no-price-msg";
            msg.textContent = "No Bonus 2 for this aircraft.";
            const btn = document.createElement("button");
            btn.className = "big-btn";
            btn.style.display = "block";
            btn.textContent = "PROCEED";
            btn.onclick = () => { if (isUnlimited) u_price = true; else localStorage.setItem("aero_price_done_" + currentMode, today); switchView("rarity"); };
            document.getElementById("grid").append(msg, btn);
        }

        function renderDevBonus3() {
            document.getElementById("grid").innerHTML = "";
            document.getElementById("inputRow").style.display = "none";
            document.getElementById("tileWrapper").style.display = "none";
            document.getElementById("gameTitle").textContent = "Bonus 3: Aircraft Category?";
            const options = ["Ultralight", "Single Engine", "Multi Engine", "Jet Engine", "Helicopter", "Airship", "Supersonic Transport", "VTOL", "Boat"];
            const rarityDone = isRarityDone();
            gameOver = rarityDone;
            renderButtonGrid(options, currentAircraft.aircraftType || "Unknown", rarityDone, choice => {
                if (choice === currentAircraft.aircraftType) confetti();
                if (isUnlimited) u_rarity = true;
                else localStorage.setItem("aero_rarity_done_" + currentMode, today);
                gameOver = true;
                showNotification("★ Answer: " + (currentAircraft.aircraftType || "Unknown"));
                showPlayAgainIfUnlimitedComplete();
            });
            if (rarityDone) showNotification("★ Answer: " + (currentAircraft.aircraftType || "Unknown"));
        }

        function renderButtonGrid(options, correctAnswer, done, onPick, requireCorrect = false, savedAnswer = "") {
            const container = document.createElement("div");
            container.className = "btn-grid";
            const btns = [];
            options.forEach(option => {
                const btn = document.createElement("button");
                btn.className = "bonus-select-btn";
                btn.textContent = option;
                if (done) {
                    btn.disabled = true;
                    if (option === correctAnswer) btn.style.background = "#538d4e";
                    else if (option === savedAnswer) btn.style.background = "#b00020";
                }
                btn.onclick = () => {
                    if (done) return;
                    if (requireCorrect && option !== correctAnswer) {
                        btn.style.background = "#b00020";
                        setTimeout(() => { btn.style.background = "#3a3a3c"; }, 600);
                        return;
                    }
                    btns.forEach(b => (b.disabled = true));
                    btn.style.background = option === correctAnswer ? "#538d4e" : "#b00020";
                    const correctBtn = btns.find(b => b.textContent === correctAnswer);
                    if (correctBtn) correctBtn.style.background = "#538d4e";
                    onPick(option);
                };
                btns.push(btn);
                container.appendChild(btn);
            });
            document.getElementById("grid").appendChild(container);
        }

        function rebuildGrid(mode) {
            const grid = document.getElementById("grid");
            grid.innerHTML = "";
            const key = mode === "main" ? `aero_guesses_main_${currentMode}` : `aero_guesses_loc_${currentMode}`;
            const history = isUnlimited ? (mode === "main" ? u_history_main : u_history_loc) : JSON.parse(localStorage.getItem(key) || "[]");
            createTiles(mode === "loc");
            const pool = mode === "main" ? hiddenPoolMain : hiddenPoolLoc;
            pool.slice(0, Math.min(history.length, 6)).forEach(idx => document.querySelectorAll('.tile')[idx]?.classList.add('revealed'));
            history.forEach((guess, index) => {
                const target = mode === "main" ? currentAircraft.name : (currentAircraft.devType === "Badge" ? currentAircraft.badgeName : currentAircraft.soldAt);
                const isCorrect = guess.toLowerCase() === target.toLowerCase();
                const row = document.createElement("div");
                row.className = "row " + (isCorrect ? "correct" : "");
                row.innerHTML = `<div>${guess}</div><div>${isCorrect ? "✔" : "✖"}</div><div>${index + 1}/6</div>`;
                grid.appendChild(row);
                if (isCorrect) fullReveal();
            });
        }

        function submitGuess() {
            const input = document.getElementById("input"), val = input.value.trim();
            if (!val || gameOver) return;
            const target = !bonusMode ? currentAircraft.name : (currentAircraft.devType === "Badge" ? currentAircraft.badgeName : currentAircraft.soldAt);
            const isCorrect = val.toLowerCase() === target.toLowerCase();
            const modeSuffix = `_${currentMode}`;
            if (isUnlimited) {
                if (!bonusMode) u_history_main.push(val); else u_history_loc.push(val);
                const histLen = !bonusMode ? u_history_main.length : u_history_loc.length;
                if (isCorrect || histLen >= 6) {
                    if (isCorrect) confetti();
                    if (!bonusMode) u_played = true;
                    else if (currentMode === "dev" && currentAircraft.devType === "Badge") { u_price = true; gameOver = true; switchView("price"); cleanupGuessInput(input); return; }
                    else u_loc = true;
                    gameOver = true;
                    switchView(bonusMode ? "loc" : "main");
                } else rebuildGrid(bonusMode ? "loc" : "main");
            } else {
                const storageKey = !bonusMode ? "aero_guesses_main" + modeSuffix : "aero_guesses_loc" + modeSuffix;
                const history = JSON.parse(localStorage.getItem(storageKey) || "[]");
                history.push(val);
                localStorage.setItem(storageKey, JSON.stringify(history));
                if (isCorrect || history.length >= 6) {
                    if (isCorrect) confetti();
                    if (!bonusMode) {
                        localStorage.setItem("aero_played_day" + modeSuffix, today);
                        const sk = streakKey(currentMode);
                        localStorage.setItem(sk, isCorrect ? String(parseInt(localStorage.getItem(sk) || "0", 10) + 1) : "0");
                        refreshStreakDisplay();
                    } else if (currentMode === "dev" && currentAircraft.devType === "Badge") {
                        localStorage.setItem("aero_price_done" + modeSuffix, today);
                        gameOver = true;
                        switchView("price");
                        cleanupGuessInput(input);
                        return;
                    } else localStorage.setItem("aero_loc_done" + modeSuffix, today);
                    gameOver = true;
                    switchView(bonusMode ? "loc" : "main");
                } else rebuildGrid(bonusMode ? "loc" : "main");
            }
            cleanupGuessInput(input);
        }

        function cleanupGuessInput(input) { input.value = ""; document.getElementById("dropdown").innerHTML = ""; }

        function createTiles(showExtra = false) {
            const img = document.getElementById("baseImage");
            if (showExtra) {
                if (currentMode === "dev" && currentAircraft.devType === "Badge") img.src = currentAircraft.badgeIcon;
                else { const c = COUNTRY_DATA.find(c => c.name === currentAircraft.soldAt); img.src = (c && c.flag) ? c.flag : "https://github.com/WormDude/AeroCraftle/blob/main/Screenshot%202026-05-03%20151543.png?raw=true"; }
            } else img.src = (currentMode === "dev" && currentAircraft.devType === "Badge" && currentAircraft.badgeIcon) ? currentAircraft.badgeIcon : currentAircraft.image;
            const tg = document.getElementById("tileGrid");
            tg.innerHTML = "";
            for (let i = 0; i < 6; i++) { const t = document.createElement("div"); t.className = "tile"; tg.appendChild(t); }
        }

        function fullReveal() { document.getElementById("tileGrid").innerHTML = ""; }
        function showNotification(text) { const box = document.getElementById("answerReveal"); box.style.display = "block"; box.textContent = text; }

        function startPriceRound() {
            const grid = document.getElementById("grid"), isDone = isPriceDone();
            if (!currentAircraft.price) {
                const msg = document.createElement("div");
                msg.className = "no-price-msg";
                msg.textContent = "This aircraft does not have a price.";
                if (isDone) { grid.appendChild(msg); return; }
                const n = document.createElement("button");
                n.className = "big-btn";
                n.style.display = "block";
                n.textContent = "PROCEED";
                n.onclick = () => { if (isUnlimited) u_price = true; else localStorage.setItem(`aero_price_done_${currentMode}`, today); switchView("rarity"); };
                grid.append(msg, n);
                return;
            }
            const container = document.createElement("div");
            container.className = "price-container";
            const saved = isUnlimited ? u_price_guess : localStorage.getItem(`aero_price_guess_${currentMode}`);
            priceRanges.forEach(r => {
                const b = document.createElement("button");
                b.className = "price-btn";
                b.textContent = r.text;
                if (isDone) { if (r.isCorrect) b.style.background = "#538d4e"; else if (saved === r.text) b.style.background = "#b00020"; b.disabled = true; }
                b.onclick = () => { if (isUnlimited) { u_price = true; u_price_guess = r.text; } else { localStorage.setItem(`aero_price_done_${currentMode}`, today); localStorage.setItem(`aero_price_guess_${currentMode}`, r.text); } if (r.isCorrect) confetti(); switchView("price"); };
                container.appendChild(b);
            });
            grid.appendChild(container);
            if (isDone) showNotification("★ Price: " + parseInt(currentAircraft.price, 10).toLocaleString());
        }

        function startRarityRound() {
            const correct = currentAircraft.rarity || "Common", container = document.createElement("div");
            container.className = "price-container";
            const isDone = isRarityDone(), saved = isUnlimited ? u_rarity_guess : localStorage.getItem(`aero_rarity_guess_${currentMode}`);
            Object.keys(RARITIES).forEach(name => {
                const b = document.createElement("button");
                b.className = "price-btn";
                b.textContent = name;
                b.style.border = `2px solid ${RARITIES[name]}`;
                if (isDone) { if (name === correct) b.style.background = RARITIES[name]; else if (saved === name) b.style.background = "#b00020"; b.disabled = true; }
                b.onclick = () => { if (isUnlimited) { u_rarity = true; u_rarity_guess = name; } else { localStorage.setItem(`aero_rarity_done_${currentMode}`, today); localStorage.setItem(`aero_rarity_guess_${currentMode}`, name); } if (name === correct) confetti(); switchView("rarity"); };
                container.appendChild(b);
            });
            document.getElementById("grid").appendChild(container);
            if (isDone) showNotification("★ Rarity: " + correct);
        }

        function showDropdown() {
            const drp = document.getElementById("dropdown"), val = document.getElementById("input").value.toLowerCase();
            let list = [];
            if (bonusMode) list = currentAircraft.devType === "Badge" ? [...MAN_BADGES].sort() : COUNTRY_DATA.map(c => c.name).sort();
            else list = DATA.filter(d => d.mode === currentMode).map(d => d.name).sort();
            drp.innerHTML = "";
            list.filter(n => n.toLowerCase().includes(val)).forEach(name => {
                const itm = document.createElement("div");
                itm.className = "option";
                itm.textContent = name;
                itm.onclick = () => { document.getElementById("input").value = name; drp.innerHTML = ""; };
                drp.appendChild(itm);
            });
        }

        const inp = document.getElementById("input");
        inp.addEventListener("input", showDropdown);
        inp.addEventListener("focus", showDropdown);
        inp.addEventListener("keydown", e => {
            if (e.key === "Enter") {
                const drp = document.getElementById("dropdown");
                if (drp.firstChild && inp.value !== drp.firstChild.textContent) { inp.value = drp.firstChild.textContent; drp.innerHTML = ""; }
                else submitGuess();
            }
        });
        document.getElementById("guessBtn").onclick = submitGuess;
        document.getElementById("bonusBtn").onclick = openBonus1;
        document.getElementById("priceBonusBtn").onclick = () => switchView("price");
        document.getElementById("rarityBonusBtn").onclick = () => switchView("rarity");

        initDaily();
        setInterval(() => {
            if (isUnlimited) return;
            const next = new Date();
            next.setHours(24, 0, 0, 0);
            const diff = next - new Date();
            if (diff <= 0) location.reload();
            const h = String(Math.floor(diff / 3600000)).padStart(2, '0'), m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0'), s = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
            document.getElementById("timer").textContent = `Next aircraft in: ${h}:${m}:${s}`;
        }, 1000);
    </script>
</body>
</html>
