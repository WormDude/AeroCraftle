<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AeroCraftle – Aircraft Guessing Game</title>
    <link rel="icon" type="image/png" href="https://github.com/WormDude/AeroCraftle/blob/main/image_2026-05-03_151522057.png?raw=true">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background: #121213; color: white; text-align: center; margin: 0; padding-bottom: 50px; }
        #main { max-width: 420px; margin: 40px auto; padding: 0 15px; position: relative; }
        #gameModeContainer { position: absolute; top: -35px; left: 15px; z-index: 100; }
        #gameModeSelect { background: #3a3a3c; color: white; border: none; padding: 5px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        #modeToggle { position: absolute; top: -35px; right: 15px; background: #538d4e; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; z-index: 10; }
        #timer, #streakBox { margin-bottom: 8px; font-weight: 600; opacity: 0.8; }
        #answerReveal { background: #b59b00; color: black; font-weight: 700; padding: 12px; border-radius: 8px; margin-bottom: 15px; display: none; }
        #navBar { display: none; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .nav-btn { background: #3a3a3c; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 11px; font-weight: bold; transition: background 0.2s; }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .nav-btn.active { background: #538d4e; }
        #tileWrapper { position: relative; width: 100%; margin-bottom: 20px; min-height: 200px; }
        #baseImage { width: 100%; display: block; border-radius: 10px; background: #1a1a1b; min-height: 200px; object-fit: contain; }
        #tileGrid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); pointer-events: none; }
        .tile { background: #111; border: 1px solid #000; transition: opacity 0.4s ease; }
        .tile.revealed { opacity: 0; }
        #inputRow { display: flex; gap: 10px; }
        #input { flex: 1; padding: 14px; border: none; border-radius: 8px; background: #1a1a1b; color: white; outline: none; font-size: 16px; }
        #guessBtn { padding: 0 20px; border: none; border-radius: 8px; background: #3a3a3c; color: white; cursor: pointer; font-weight: 600; }
        .big-btn { display: none; width: 100%; margin-top: 15px; padding: 14px; border: none; border-radius: 8px; background: #5a5a5c; color: white; cursor: pointer; font-weight: bold; }
        #playAgainBtn { background: #538d4e; margin-top: 20px; }
        #dropdown { background: #1a1a1b; margin-top: 5px; border-radius: 8px; max-height: 200px; overflow-y: auto; text-align: left; }
        .option { padding: 12px; cursor: pointer; border-bottom: 1px solid #222; }
        .option:hover { background: #3a3a3c; }
        .row { display: grid; grid-template-columns: 1fr 50px 60px; background: #1a1a1b; margin-top: 8px; padding: 12px; border-radius: 8px; align-items: center; }
        .row.correct { background: #538d4e; }
        .price-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .price-btn { padding: 18px; border-radius: 8px; border: none; background: #3a3a3c; color: white !important; cursor: pointer; font-weight: 700; font-size: 14px; }
        .no-price-msg { font-size: 18px; font-weight: 600; margin: 30px 0; color: #aaa; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .bonus-select-btn { padding: 15px; border-radius: 8px; border: none; background: #3a3a3c; color: white; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="main">
        <div id="gameModeContainer">
            <select id="gameModeSelect" onchange="changeMode(this.value)">
                <option value="standard">Standard</option>
                <option value="dev">Event/Dev</option>
                <option value="boats">Boats</option>
            </select>
        </div>
        <button id="modeToggle" onclick="toggleMode()">Unlimited Mode</button>
        <h1 id="gameTitle">AeroCraftle</h1>

        <div id="navBar">
            <button class="nav-btn" id="nav-main" onclick="switchView('main')">Round 1</button>
            <button class="nav-btn" id="nav-loc" onclick="openBonus1()">Bonus 1</button>
            <button class="nav-btn" id="nav-price" onclick="switchView('price')">Bonus 2</button>
            <button class="nav-btn" id="nav-rarity" onclick="switchView('rarity')">Bonus 3</button>
            <button class="nav-btn" id="nav-desc" onclick="switchView('desc')">Bonus 4</button>
        </div>

        <div id="timer">Loading...</div>
        <div id="streakBox">🔥 Standard streak: 0</div>
        <div id="answerReveal"></div>

        <div id="tileWrapper">
            <img id="baseImage" alt="Aircraft to guess">
            <div id="tileGrid"></div>
        </div>

        <div id="inputRow">
            <input id="input" autocomplete="off" placeholder="Type name...">
            <button id="guessBtn">Guess</button>
        </div>

        <button id="bonusBtn" class="big-btn">PLAY BONUS ROUND</button>
        <button id="priceBonusBtn" class="big-btn">PLAY 2ND BONUS ROUND</button>
        <button id="rarityBonusBtn" class="big-btn">PLAY 3RD BONUS ROUND</button>
        <button id="descBonusBtn" class="big-btn">PLAY 4TH BONUS ROUND</button>
        <button id="nextBonusBtn" class="big-btn">PLAY NEXT BONUS ROUND</button>
        <button id="playAgainBtn" class="big-btn" onclick="resetUnlimited()">PLAY AGAIN</button>

        <div id="dropdown"></div>
        <div id="grid"></div>
    </div>

            const pool = DATA.filter(d => d.mode === currentMode);
            const index = Math.floor((new Date() - new Date(2024, 0, 1)) / 86400000) % pool.length;
            currentAircraft = pool[index];

        function resetUnlimited() {
            if (isUnlimited) {
                const pool = DATA.filter(d => d.mode === currentMode);
                const recent = getRecentQueue();
                let newAircraft;
                do { newAircraft = pool[Math.floor(Math.random() * pool.length)]; } while (recent.includes(newAircraft.name) && pool.length > 5);
                currentAircraft = newAircraft;
                recent.push(currentAircraft.name);
                if (recent.length > 5) recent.shift();
                u_played = false; u_loc = false; u_price = false; u_rarity = false; u_desc = false;
                u_history_main = []; u_history_loc = []; u_loc_guess = ""; u_price_guess = ""; u_rarity_guess = ""; u_desc_guesses = []; u_desc_options = [];
                resetTilePools();
                generateDailyPriceRanges();
            }
            switchView('main');
            refreshStreakDisplay();

        function resetTilePools() { hiddenPoolMain = [0,1,2,3,4,5]; hiddenPoolLoc = [0,1,2,3,4,5]; shuffle(hiddenPoolMain); shuffle(hiddenPoolLoc); }
        function shuffle(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } }

        function generateDailyPriceRanges() {
            priceRanges = [];
            if (!currentAircraft.price) return;
            const price = parseInt(currentAircraft.price, 10);
            const step = price > 50000 ? 10000 : (price > 10000 ? 5000 : 1000);
            const correctIndex = Math.floor(Math.random() * 4);
            const randomOffset = Math.floor(Math.random() * (step * 0.5));
            let start = Math.max(0, Math.floor((price - (correctIndex * step) - randomOffset) / 500) * 500);
            for (let i = 0; i < 4; i++) {
                const min = start + (i * step), max = min + step - 1;
                priceRanges.push({ min, max, text: `${min.toLocaleString()} - ${max.toLocaleString()}`, isCorrect: (price >= min && price <= max) });
            }
        }

        function isMainDone() { return isUnlimited ? u_played : (localStorage.getItem("aero_played_day_" + currentMode) === today); }

            const playedMain = isMainDone(), locDone = isLocDone(), priceDone = isPriceDone(), rarityDone = isRarityDone(), descDone = isDescriptionDone(), descAvailable = hasDescriptionBonus(), skipLoc = skipsSoldAtBonus();

                else { inputRow.style.display = "flex"; gameOver = false; }
                if (playedMain && (!locDone || skipLoc)) document.getElementById("bonusBtn").style.display = "block";
                if (playedMain && locDone && !skipLoc && !priceDone) document.getElementById("priceBonusBtn").style.display = "block";
                if (playedMain && priceDone && !rarityDone) document.getElementById("rarityBonusBtn").style.display = "block";
                if (playedMain && rarityDone && descAvailable && !descDone) document.getElementById("descBonusBtn").style.display = "block";
            } else if (mode === "loc") {
                bonusMode = true;
                if (skipLoc) renderSkippedSoldAtRound();
                else if (currentMode === "dev") renderDevBonus1();
                else renderSoldAtRound(locDone);
                if (!skipLoc && playedMain && locDone && !priceDone) setNextBonus("price");
            } else if (mode === "price") {
                wrapper.style.display = "none";
                if (currentMode === "dev") renderDevBonus2();
                else { document.getElementById("gameTitle").textContent = "Bonus 2: Guess the Price"; startPriceRound(); }
                if (playedMain && priceDone && !rarityDone) setNextBonus("rarity");

                wrapper.style.display = "none";
                if (currentMode === "dev") renderDevBonus3();
                else { document.getElementById("gameTitle").textContent = "Bonus 3: What is the Rarity?"; startRarityRound(); }
                if (playedMain && rarityDone && descAvailable && !descDone) setNextBonus("desc");

                wrapper.style.display = "none";
                if (descAvailable) startDescriptionRound();

            showPlayAgainIfUnlimitedComplete();
            const active = { main: "nav-main", loc: "nav-loc", price: "nav-price", rarity: "nav-rarity", desc: "nav-desc" }[mode];

        function renderButtonGrid(options, correctAnswer, done, onPick, requireCorrect = false, savedAnswer = "") {
            const container = document.createElement("div");
            container.className = "btn-grid";
            const btns = [];
            options.forEach(option => {
                const btn = document.createElement("button");
                btn.className = "bonus-select-btn";
                btn.textContent = option;
                if (done) {
                    btn.disabled = true;
                    if (option === correctAnswer) btn.style.background = "#538d4e";
                    else if (option === savedAnswer) btn.style.background = "#b00020";
                }
                btn.onclick = () => {
                    if (done) return;
                    if (requireCorrect && option !== correctAnswer) {
                        btn.style.background = "#b00020";
                        setTimeout(() => { btn.style.background = "#3a3a3c"; }, 600);
                        return;
                    }
                    btns.forEach(b => (b.disabled = true));
                    btn.style.background = option === correctAnswer ? "#538d4e" : "#b00020";
                    const correctBtn = btns.find(b => b.textContent === correctAnswer);
                    if (correctBtn) correctBtn.style.background = "#538d4e";
                    onPick(option);
                };
                btns.push(btn);
                container.appendChild(btn);
            });
            document.getElementById("grid").appendChild(container);
        }

            const grid = document.getElementById("grid");
            grid.innerHTML = "";
            const key = mode === "main" ? `aero_guesses_main_${currentMode}` : `aero_guesses_loc_${currentMode}`;
            const history = isUnlimited ? (mode === "main" ? u_history_main : u_history_loc) : JSON.parse(localStorage.getItem(key) || "[]");
            createTiles(mode === "loc");
            const pool = mode === "main" ? hiddenPoolMain : hiddenPoolLoc;
            pool.slice(0, Math.min(history.length, 6)).forEach(idx => document.querySelectorAll('.tile')[idx]?.classList.add('revealed'));
            history.forEach((guess, index) => {
                const target = mode === "main" ? currentAircraft.name : (currentAircraft.devType === "Badge" ? currentAircraft.badgeName : currentAircraft.soldAt);
                const isCorrect = guess.toLowerCase() === target.toLowerCase();
                const row = document.createElement("div");
                row.className = "row " + (isCorrect ? "correct" : "");
                row.innerHTML = `<div>${guess}</div><div>${isCorrect ? "✔" : "✖"}</div><div>${index + 1}/6</div>`;
                grid.appendChild(row);
                if (isCorrect) fullReveal();
            });

            const isCorrect = val.toLowerCase() === target.toLowerCase();
            const modeSuffix = `_${currentMode}`;
            if (isUnlimited) {
                if (!bonusMode) u_history_main.push(val); else u_history_loc.push(val);
                const histLen = !bonusMode ? u_history_main.length : u_history_loc.length;
                if (isCorrect || histLen >= 6) {
                    if (isCorrect) confetti();
                    if (!bonusMode) u_played = true;
                    else if (currentMode === "dev" && currentAircraft.devType === "Badge") { u_price = true; gameOver = true; switchView("price"); cleanupGuessInput(input); return; }
                    else u_loc = true;
                    gameOver = true;
                    switchView(bonusMode ? "loc" : "main");
                } else rebuildGrid(bonusMode ? "loc" : "main");
            } else {
                const storageKey = !bonusMode ? "aero_guesses_main" + modeSuffix : "aero_guesses_loc" + modeSuffix;
                const history = JSON.parse(localStorage.getItem(storageKey) || "[]");
                history.push(val);
                localStorage.setItem(storageKey, JSON.stringify(history));
                if (isCorrect || history.length >= 6) {
                    if (isCorrect) confetti();
                    if (!bonusMode) {
                        localStorage.setItem("aero_played_day" + modeSuffix, today);
                        const sk = streakKey(currentMode);
                        localStorage.setItem(sk, isCorrect ? String(parseInt(localStorage.getItem(sk) || "0", 10) + 1) : "0");
                        refreshStreakDisplay();
                    } else if (currentMode === "dev" && currentAircraft.devType === "Badge") {
                        localStorage.setItem("aero_price_done" + modeSuffix, today);
                        gameOver = true;
                        switchView("price");
                        cleanupGuessInput(input);
                        return;
                    } else localStorage.setItem("aero_loc_done" + modeSuffix, today);
                    gameOver = true;
                    switchView(bonusMode ? "loc" : "main");
                } else rebuildGrid(bonusMode ? "loc" : "main");
            }
            cleanupGuessInput(input);
        }

        function cleanupGuessInput(input) { input.value = ""; document.getElementById("dropdown").innerHTML = ""; }

        function createTiles(showExtra = false) {
            const img = document.getElementById("baseImage");
            if (showExtra) {
                if (currentMode === "dev" && currentAircraft.devType === "Badge") img.src = currentAircraft.badgeIcon;
                else { const c = COUNTRY_DATA.find(c => c.name === currentAircraft.soldAt); img.src = (c && c.flag) ? c.flag : "https://github.com/WormDude/AeroCraftle/blob/main/Screenshot%202026-05-03%20151543.png?raw=true"; }
            } else img.src = currentAircraft.image;
            const tg = document.getElementById("tileGrid");
            tg.innerHTML = "";
            for (let i = 0; i < 6; i++) { const t = document.createElement("div"); t.className = "tile"; tg.appendChild(t); }
        }

        function fullReveal() { document.getElementById("tileGrid").innerHTML = ""; }
        function showNotification(text) { const box = document.getElementById("answerReveal"); box.style.display = "block"; box.textContent = text; }

        function startPriceRound() {
            const grid = document.getElementById("grid"), isDone = isPriceDone();
            if (!currentAircraft.price) {
                const msg = document.createElement("div");
                msg.className = "no-price-msg";
                msg.textContent = "This aircraft does not have a price.";
                if (isDone) { grid.appendChild(msg); return; }
                const n = document.createElement("button");
                n.className = "big-btn";
                n.style.display = "block";
                n.textContent = "PROCEED";
                n.onclick = () => { if (isUnlimited) u_price = true; else localStorage.setItem(`aero_price_done_${currentMode}`, today); switchView("rarity"); };
                grid.append(msg, n);
                return;
            }
            const container = document.createElement("div");
            container.className = "price-container";
            const saved = isUnlimited ? u_price_guess : localStorage.getItem(`aero_price_guess_${currentMode}`);
            priceRanges.forEach(r => {
                const b = document.createElement("button");
                b.className = "price-btn";
                b.textContent = r.text;
                if (isDone) { if (r.isCorrect) b.style.background = "#538d4e"; else if (saved === r.text) b.style.background = "#b00020"; b.disabled = true; }
                b.onclick = () => { if (isUnlimited) { u_price = true; u_price_guess = r.text; } else { localStorage.setItem(`aero_price_done_${currentMode}`, today); localStorage.setItem(`aero_price_guess_${currentMode}`, r.text); } if (r.isCorrect) confetti(); switchView("price"); };
                container.appendChild(b);
            });
            grid.appendChild(container);
            if (isDone) showNotification("★ Price: " + parseInt(currentAircraft.price, 10).toLocaleString());
        }

        function startRarityRound() {
            const correct = currentAircraft.rarity || "Common", container = document.createElement("div");
            container.className = "price-container";
            const isDone = isRarityDone(), saved = isUnlimited ? u_rarity_guess : localStorage.getItem(`aero_rarity_guess_${currentMode}`);
            Object.keys(RARITIES).forEach(name => {
                const b = document.createElement("button");
                b.className = "price-btn";
                b.textContent = name;
                b.style.border = `2px solid ${RARITIES[name]}`;
                if (isDone) { if (name === correct) b.style.background = RARITIES[name]; else if (saved === name) b.style.background = "#b00020"; b.disabled = true; }
                b.onclick = () => { if (isUnlimited) { u_rarity = true; u_rarity_guess = name; } else { localStorage.setItem(`aero_rarity_done_${currentMode}`, today); localStorage.setItem(`aero_rarity_guess_${currentMode}`, name); } if (name === correct) confetti(); switchView("rarity"); };
                container.appendChild(b);
            });
            document.getElementById("grid").appendChild(container);
            if (isDone) showNotification("★ Rarity: " + correct);
        }

        function getStoredDescriptionGuesses() {
            if (isUnlimited) return u_desc_guesses;
            return JSON.parse(localStorage.getItem(`aero_desc_guesses_${currentMode}`) || "[]");
        }

        function setStoredDescriptionGuesses(guesses) {
            if (isUnlimited) u_desc_guesses = guesses;
            else localStorage.setItem(`aero_desc_guesses_${currentMode}`, JSON.stringify(guesses));
        }

        function getDescriptionOptions() {
            if (isUnlimited && u_desc_options.length) return u_desc_options;
            if (!isUnlimited) {
                const saved = JSON.parse(localStorage.getItem(`aero_desc_options_${currentMode}`) || "[]");
                if (saved.length) return saved;
            }

            const correct = currentAircraft.description;
            const descriptions = [...new Set(DATA
                .filter(item => item.mode === currentMode && item.description)
                .map(item => item.description))];
            let distractors = descriptions.filter(description => description !== correct);

            if (distractors.length < DESCRIPTION_BUTTON_COUNT - 1) {
                const fallback = [...new Set(DATA
                    .filter(item => item.mode !== "dev" && item.description)
                    .map(item => item.description))]
                    .filter(description => description !== correct && !distractors.includes(description));
                distractors = distractors.concat(fallback);
            }

            shuffle(distractors);
            const options = [correct, ...distractors.slice(0, DESCRIPTION_BUTTON_COUNT - 1)];
            shuffle(options);

            if (isUnlimited) u_desc_options = options;
            else localStorage.setItem(`aero_desc_options_${currentMode}`, JSON.stringify(options));
            return options;
        }

        function startDescriptionRound() {
            document.getElementById("gameTitle").textContent = "Bonus 4: Guess the Description";
            document.getElementById("tileWrapper").style.display = "none";
            document.getElementById("inputRow").style.display = "none";

            const correct = currentAircraft.description;
            const isDone = isDescriptionDone();
            const guesses = getStoredDescriptionGuesses();
            const container = document.createElement("div");
            container.className = "price-container";

            getDescriptionOptions().forEach(description => {
                const b = document.createElement("button");
                b.className = "price-btn";
                b.textContent = description;
                if (isDone || guesses.includes(description)) {
                    b.disabled = isDone || guesses.includes(description);
                    if (description === correct && isDone) b.style.background = "#538d4e";
                    else if (guesses.includes(description) && description !== correct) b.style.background = "#b00020";
                }
                b.onclick = () => {
                    const nextGuesses = [...getStoredDescriptionGuesses(), description];
                    setStoredDescriptionGuesses(nextGuesses);
                    const correctGuess = description === correct;
                    if (correctGuess) confetti();
                    if (correctGuess || nextGuesses.length >= 2) {
                        if (isUnlimited) u_desc = true;
                        else localStorage.setItem(`aero_desc_done_${currentMode}`, today);
                    }
                    switchView("desc");
                };
                container.appendChild(b);
            });

            document.getElementById("grid").appendChild(container);
            if (isDone) showNotification("★ Description: " + correct);
        }

        function showDropdown() {
            const drp = document.getElementById("dropdown"), val = document.getElementById("input").value.toLowerCase();
            let list = [];
            if (bonusMode) list = currentAircraft.devType === "Badge" ? [...MAN_BADGES].sort() : COUNTRY_DATA.map(c => c.name).filter(name => name !== NO_SOLD_AT).sort();
            else list = DATA.filter(d => d.mode === currentMode).map(d => d.name).sort();
            drp.innerHTML = "";
            list.filter(n => n.toLowerCase().includes(val)).forEach(name => {
                const itm = document.createElement("div");
                itm.className = "option";
                itm.textContent = name;
                itm.onclick = () => { document.getElementById("input").value = name; drp.innerHTML = ""; };
                drp.appendChild(itm);
            });
        }

        const inp = document.getElementById("input");
        inp.addEventListener("input", showDropdown);
        inp.addEventListener("focus", showDropdown);
        inp.addEventListener("keydown", e => {
            if (e.key === "Enter") {
                const drp = document.getElementById("dropdown");
                if (drp.firstChild && inp.value !== drp.firstChild.textContent) { inp.value = drp.firstChild.textContent; drp.innerHTML = ""; }
                else submitGuess();
            }
        });
        document.getElementById("guessBtn").onclick = submitGuess;
        document.getElementById("bonusBtn").onclick = openBonus1;
        document.getElementById("priceBonusBtn").onclick = () => switchView("price");
        document.getElementById("rarityBonusBtn").onclick = () => switchView("rarity");
        document.getElementById("descBonusBtn").onclick = () => switchView("desc");

        initDaily();
        setInterval(() => {
            if (isUnlimited) return;
            const next = new Date();
            next.setHours(24, 0, 0, 0);
            const diff = next - new Date();
            if (diff <= 0) location.reload();
            const h = String(Math.floor(diff / 3600000)).padStart(2, '0'), m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0'), s = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
            document.getElementById("timer").textContent = `Next aircraft in: ${h}:${m}:${s}`;
        }, 1000);
    </script>
</body>
</html>
